# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Install dependencies and test
      env:
        TF_CPP_MIN_LOG_LEVEL: "3"
      run: |
        uv venv --python 3.12
        source .venv/bin/activate
        uv pip install -e ".[dev]"
        pytest tests
    - name: Verify the tag matches the packaged version
      if: github.event_name == 'release'
      run: |
        source .venv/bin/activate
        package_version="$(python -c 'import infinite_training; print(infinite_training.__version__)')"
        tag_version="${GITHUB_REF_NAME#v}"
        if [ "$package_version" != "$tag_version" ]; then
          echo "::error::Tag $tag_version does not match package version $package_version"
          exit 1
        fi
    - name: Build package
      run: |
        source .venv/bin/activate
        uv build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
