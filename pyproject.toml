[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "infinite_training"
version = "2.2.0"
authors = [
  { name="Nguyễn Chí Vỹ", email="vyncint@icloud.com" },
]
description = "Train Keras or PyTorch models until a target metric, a timeout, or Ctrl+C stops them - and resume where you left off."
readme = "README.md"
# Bounded by TensorFlow, which requires >=3.10 from 2.16 onward.
requires-python = ">=3.10"
keywords = [
    "tensorflow",
    "keras",
    "pytorch",
    "torch",
    "training",
    "checkpointing",
    "early-stopping",
    "machine-learning",
]
# TensorFlow stays a hard requirement for the 2.x line so that an existing
# `pip install infinite-training` keeps working unchanged. It moves to the
# `tensorflow` extra in 3.0.0; the extra is already declared below so that new
# code can opt into the future spelling today.
dependencies = [
    "tensorflow",
    "numpy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
"Homepage" = "https://github.com/vyncint/infinite-training"
"Bug Tracker" = "https://github.com/vyncint/infinite-training/issues"
"Changelog" = "https://github.com/vyncint/infinite-training/blob/main/CHANGELOG.md"

[project.optional-dependencies]
tensorflow = [
    "tensorflow",
]
torch = [
    "torch",
]
dev = [
    "pytest>=7",
    "ruff>=0.6",
]
example = [
    "tensorflow-datasets",
    "importlib_resources"
]

[tool.setuptools.packages.find]
include = ["infinite_training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
